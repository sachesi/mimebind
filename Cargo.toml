[package]
name = "mimebind"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "A GTK4 app to choose which application opens which file type"
repository = "https://github.com/sachesi/mimebind"
readme = "README.md"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
