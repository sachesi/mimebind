name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    # The toolchain and the libraries the RPMs are built with.
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git-core rust cargo rustfmt clippy just blueprint-compiler
          gtk4-devel libadwaita-devel glib2-devel shared-mime-info
          desktop-file-utils appstream gettext
      - uses: actions/checkout@v5
      # The tests assign types between installed applications; a bare container has none.
      - name: Install two applications for the tests
        run: |
          apps="${XDG_DATA_HOME:-$HOME/.local/share}/applications"
          mkdir -p "$apps"
          for name in viewer editor; do
            printf '[Desktop Entry]\nType=Application\nName=%s\nExec=true %%f\nMimeType=text/plain;image/png;\n' "$name" > "$apps/$name.desktop"
          done
      - name: Lint
        run: just check
      - name: Test
        run: just test

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  aur:
    name: AUR
    needs: [check, deny]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/aur.yml
